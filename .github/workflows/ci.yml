name: ci

on:
  push:
    branches: [dev, test, main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r runner/requirements.txt pytest httpx
      - name: Test
        env:
          PYTHONPATH: runner
          LOCAL_DEV: "0"
        run: pytest -q
